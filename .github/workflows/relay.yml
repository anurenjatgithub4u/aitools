# Deploys the realtime relay (server/) to Fly.io whenever it changes on main.
# Needs one repo secret: FLY_API_TOKEN  (create with: flyctl tokens create deploy -a findurai-realtime)
name: Deploy relay
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/relay.yml']
  workflow_dispatch:
concurrency: { group: relay-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN }}" }
